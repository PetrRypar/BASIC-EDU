name: Build and test Windows prototype
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 20
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.x'
      - name: Build, test and package unsigned Windows x64 app
        shell: pwsh
        run: ./build.ps1 -Portable -WpfTests
      - name: Upload unsigned build for review (not a release)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: BasicEdu-unsigned-win-x64
          path: |
            dist/BasicEdu-1.0-win-x64.zip
            dist/BasicEdu-1.0-win-x64.zip.sha256
          if-no-files-found: error
          retention-days: 14
